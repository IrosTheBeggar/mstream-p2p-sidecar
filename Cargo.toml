[package]
name = "p2p-sidecar"
version = "1.0.4"
edition = "2021"

[[bin]]
name = "p2p-sidecar"
path = "src/main.rs"

[dependencies]
# Versions are pinned EXACTLY (=x.y.z). iroh-blobs 0.103's own README calls it
# "not yet production quality" (the production 0.35 line pairs with the old
# iroh 0.35, incompatible with the iroh 1.0 line mStream's tunnel uses), and
# the iroh crates have real API churn between releases. This exact set was
# validated end-to-end by the 2026-07 networking spike (iroh patch-bumped
# 1.0.1 → 1.0.3 on 2026-07-28, integration suite re-run) — bump the crates
# together, deliberately, and re-run the integration tests when you do.
iroh = "=1.0.3"
iroh-blobs = "=0.103.0"
# iroh-gossip comes from the mStream FORK, not crates.io: the tag is
# upstream v0.101.0 (the newest release, still the exact set validated by
# the 2026-07 spike) plus upstream PR #154, which is open but unmerged —
# without it, every superseded or dropped peer link between two live
# processes leaks a kept-alive QUIC connection (~110 KB each, about one
# per hyparview shuffle interval per node), which is what OOM-killed
# long-running sidecars on a ~102-hour fuse (mStream #880/#881, and the
# fork's own commit message for the full record). Retire the fork and
# re-pin "=0.101.x" from crates.io the moment an upstream release contains
# the fix; treat the tag like the exact pins around it — never track a
# branch.
iroh-gossip = { git = "https://github.com/IrosTheBeggar/iroh-gossip", tag = "v0.101.0-leakfix.1" }
iroh-tickets = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "sync", "time"] }
tokio-stream = "0.1"

[profile.release]
strip = true
# Size-tuned (2026-08-19): the sidecar ships in every release bundle and is
# runtime-fetched by npm installs, so bytes matter more than the last few
# percent of throughput (payloads are announcements, DMs, and catalog blobs
# — not the QC media tunnel, which lives in-process via @number0/iroh).
# Measured on this dep tree (baseline = the previous strip-only profile):
#   win32-x64:  20.5 MB -> 6.7 MB (-67%)
#   linux-x64:  21.2 MB -> 8.1 MB (-62%); opt-level "z" = 7.6 MB (-64%)
# The bulk is fat LTO + 1 codegen unit deduplicating iroh's generic-heavy
# async code, plus panic=abort shedding unwind tables. "z" buys only ~7%
# over "s" — kept at "s" for optimizer headroom; flip to "z" if bytes ever
# matter more. Feature audit found nothing to trim: pkarr/swarm-discovery
# already absent, hickory-resolver is the dial-by-endpointId path, metrics
# is the exporter-less form. NO packers/UPX ever — AV/SmartApp heuristics.
# panic = "abort": no catch_unwind anywhere in main.rs (prod code is all
# anyhow Results; the only panic!s are test asserts), and the Node side
# (discovery-p2p.js) already treats child exit as a respawn signal — a loud
# abort beats a half-dead sidecar with one crashed tokio task.
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
