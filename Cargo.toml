[package]
name = "p2p-sidecar"
version = "1.4.0"
edition = "2021"

[[bin]]
name = "p2p-sidecar"
path = "src/main.rs"

[dependencies]
# Versions are pinned EXACTLY (=x.y.z): the iroh crates have real API churn
# between releases, so bump them together, deliberately, and re-run the
# integration tests when you do. History: 1.0.1 → 1.0.3 (2026-07 spike);
# 1.0.3 → 1.4.1 + iroh-blobs 0.103.1 on 2026-10-23 (0.103.0 was yanked
# upstream; "update all packages" pass with the gossip fix below).
iroh = "=1.4.1"
iroh-blobs = "=0.103.1"
# iroh-gossip: NOT the crates.io 0.101.0 release. That release (and our old
# leakfix fork of it) has a network-wide failure mode: the gossip actor
# blocks on the per-peer send queue (`active_send_tx.send(msg).await`,
# 64 slots, no write timeout) when a neighbor stops reading, which freezes
# every topic on the node — and a frozen node stops reading too, so the
# freeze spreads to its neighbors. On 2026-10-22 it took down the production
# sidecar and BOTH community seeds (mStream memory:
# discovery-mesh-wedge-incident-2026-10-22; upstream
# n0-computer/iroh-gossip#47 and #185). The fork tag below is upstream
# `main` at cf859543 (2026-10-22: #161 peer lifecycle, #178 idle-connection
# close, #186 actor-stall fixes, #189/#195 mixed-version safety, #191/#192
# rejoin) plus upstream PR #185 (the byte-bounded per-peer send queue: the
# actor never waits on a peer, data that does not fit is dropped, a control
# message that does not fit aborts the peer; approved but unmerged at pin
# time) — i.e. PR #185's head commit d60b06ed, which already contains main,
# re-tagged on our fork so a squash-merge upstream can't orphan the rev.
# Wire ALPN (/iroh-gossip/1) and message formats are unchanged since
# 0.101.0, so this interoperates with the deployed 0.101 fleet. Re-pin to
# the next crates.io release once it contains #185; treat the tag like the
# exact pins around it — never track a branch.
iroh-gossip = { git = "https://github.com/IrosTheBeggar/iroh-gossip", tag = "v0.101.0-wedgefix.1" }
iroh-tickets = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "sync", "time"] }
tokio-stream = "0.1"

[profile.release]
strip = true
# Size-tuned (2026-08-19): the sidecar ships in every release bundle and is
# runtime-fetched by npm installs, so bytes matter more than the last few
# percent of throughput (payloads are announcements, DMs, and catalog blobs
# — not the QC media tunnel, which lives in-process via @number0/iroh).
# Measured on this dep tree (baseline = the previous strip-only profile):
#   win32-x64:  20.5 MB -> 6.7 MB (-67%)
#   linux-x64:  21.2 MB -> 8.1 MB (-62%); opt-level "z" = 7.6 MB (-64%)
# The bulk is fat LTO + 1 codegen unit deduplicating iroh's generic-heavy
# async code, plus panic=abort shedding unwind tables. "z" buys only ~7%
# over "s" — kept at "s" for optimizer headroom; flip to "z" if bytes ever
# matter more. Feature audit found nothing to trim: pkarr/swarm-discovery
# already absent, hickory-resolver is the dial-by-endpointId path, metrics
# is the exporter-less form. NO packers/UPX ever — AV/SmartApp heuristics.
# panic = "abort": no catch_unwind anywhere in main.rs (prod code is all
# anyhow Results; the only panic!s are test asserts), and the Node side
# (discovery-p2p.js) already treats child exit as a respawn signal — a loud
# abort beats a half-dead sidecar with one crashed tokio task.
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
